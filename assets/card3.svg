<svg xmlns="http://www.w3.org/2000/svg" width="490" height="215" viewBox="0 0 490 215"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070b"/><stop offset="1" stop-color="#1f040c"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ff1f3d" stroke-opacity="0.09"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.28"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#ff1f3d" stop-opacity="0.5"/><stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff1f3d" stop-opacity="0"/><stop offset="0.5" stop-color="#ffb3be" stop-opacity="0.9"/><stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/></linearGradient>
<filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><style>
text{font-family:'Courier New', Consolas, 'Liberation Mono', monospace}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{fill-opacity:0}}
